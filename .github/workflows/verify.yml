name: Verify Client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.11.1'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build:all
      - run: npm run check:editions
      - run: npm ci --prefix tools/community-lint --ignore-scripts
      - run: npm run build:cn
      - run: npm run check:community
